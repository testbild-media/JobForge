{% extends "base.html" %}{% load static %}
{% block body %}
<div class="auth"><div class="card" style="text-align:center">
  <div class="logo"><picture>
    <source srcset="{% static 'branding/logo_dark.svg' %}" media="(prefers-color-scheme: dark)">
    <img src="{% static 'branding/logo_light.svg' %}" alt="JobForge – Forge your workflow">
  </picture></div>
  <h1 style="font-size:1.2rem;margin-top:1rem">Keine Verbindung</h1>
  <p class="muted">Sie sind offline. Sobald die Verbindung wieder besteht, können Sie weiterarbeiten.</p>
  <button class="btn btn-primary" onclick="location.reload()">Erneut versuchen</button>
</div></div>
{% endblock %}
