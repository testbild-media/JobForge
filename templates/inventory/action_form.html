{% extends "base.html" %}{% load jf %}
{% block content %}
<div class="page-head"><h1>{% icon icon|default:'box' 22 %} {{ title }}</h1></div>
<div class="card" style="max-width:860px">
  {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary btn-lg" type="submit">{% icon 'check' 16 %} Ausführen</button>
      <a class="btn btn-lg" href="javascript:history.back()">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
