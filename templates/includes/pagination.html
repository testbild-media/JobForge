{% load jf %}{% if page.has_other_pages %}
<nav class="pagination">
  {% if page.has_previous %}<a class="btn btn-sm" href="{% qs page=page.previous_page_number %}">‹ Zurück</a>{% endif %}
  <span class="muted">Seite {{ page.number }} von {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-sm" href="{% qs page=page.next_page_number %}">Weiter ›</a>{% endif %}
</nav>
{% endif %}
