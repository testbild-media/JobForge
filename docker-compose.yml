# JobForge mit Docker Compose:
#   cp .env.example .env   (SECRET_KEY setzen, DEBUG=0)
#   docker compose up -d
#   docker compose logs jobforge | grep JOBFORGE_ADMIN   (initiales Admin-Passwort)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobforge-bitte-aendern}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      retries: 10

  jobforge:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DEBUG: "0"
      DATABASE_URL: postgres://jobforge:${POSTGRES_PASSWORD:-jobforge-bitte-aendern}@db:5432/jobforge
      DATA_DIR: /data
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - data:/data

volumes:
  db:
  data:
